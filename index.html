<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exchange Rate Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <h2 style="color:brown">Exchange Rate Calculator</h2>
        <label for="exchange-rate">Exchange Rate:</label>
        <input type="number" step="0.01" id="exchange-rate" placeholder="Enter exchange rate" required>
        <button id="calculate-button" onclick="calculateFeeClicked()">Calculate</button>
    </main>
<script src="index.js"></script>
</body>
</html>
