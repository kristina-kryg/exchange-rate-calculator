<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exchange Rate Calculator</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap">
    <link rel="icon" href="favicon-32x32.png" type="image/x-icon">
</head>
<body>
    <main>
        <h1>Exchange Rate Calculator</h1>
        <p id="description">Use the converter below to get an indication of the commission fee</p>
        <section class="calculator">
        <h3>Calculate Commission Fee</h3>
        <div class="input-group">
        <label for="exchange-rate">Exchange Rate:</label>
        <input type="number" step="0.01" id="exchange-rate" placeholder="Enter exchange rate" required>
        </div>
        <div class="input-group">
        <label for="fee">Commission Fee:</label>
        <input type="number" step="0.01" id="fee" placeholder="Enter commission fee" required>
        </div>
        <div class="button-row">
        <button id="clear-button" onclick="clearInputs()">Clear</button>
        <button id="calculate-button" onclick="calculateFeeFromInputs()">Calculate</button>
    </div>
        </section>
<section class="result">
        <h3>Result</h3>
        <p id="fee-result"></p>
        </section>
    </main>
<script src="index.js"></script>
</body>
</html>
